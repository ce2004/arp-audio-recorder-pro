name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger only when you push a tag like v1.0.0

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write # Needed to create a GitHub Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: pyinstaller --windowed --name "Audio Recorder Pro" app.py
        
    - name: Create Zip Archive
      run: |
        xcopy sounds "dist\Audio Recorder Pro\sounds\" /E /I
        copy README.md "dist\Audio Recorder Pro\"
        Compress-Archive -Path "dist\Audio Recorder Pro\*" -DestinationPath "dist\Audio Recorder Pro.zip"

    - name: Extract Release Notes
      id: extract_notes
      shell: python
      run: |
        notes = []
        capture = False
        with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            for line in f:
                if line.startswith('v'):
                    if capture: break
                    capture = True
                    continue
                if capture:
                    if line.startswith('---'): break
                    if line.strip(): notes.append(line.strip())
        with open('release_notes.txt', 'w', encoding='utf-8') as f:
            f.write('\n'.join(notes))

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: "dist/Audio Recorder Pro.zip"
        body_path: release_notes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
