name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger only when you push a tag like v1.0.0

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write # Needed to create a GitHub Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build with PyInstaller
      run: pyinstaller --onefile --windowed app.py
        
    - name: Create Zip Archive
      run: |
        mkdir dist\ARP_Audio_Recorder
        copy dist\app.exe dist\ARP_Audio_Recorder\
        xcopy sounds dist\ARP_Audio_Recorder\sounds\ /E /I
        Compress-Archive -Path dist\ARP_Audio_Recorder\* -DestinationPath dist\app.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
